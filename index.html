<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elourdes Vote - Login</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <div class="right">
      <div class="login-box">

        <div class="brand-image" role="img" aria-label="Elourdes Student Council Elections"></div>

        <div id="login-form">
          <input type="email" id="username" placeholder="Email">
          <input type="password" id="password" placeholder="Password">

          <div class="options">
            <label><input type="checkbox"> Remember me</label>
            <a href="#" onclick="forgotPassword(event)">Forgot Password?</a>
          </div>

          <button onclick="login()">LOGIN</button>

          <p class="signup">
            Don’t have an account? <a href="#" onclick="showSignup(event)">Sign up</a>
          </p>

          <p id="message"></p>
        </div>

        <form id="forgot-form" class="forgot-form" onsubmit="resetPassword(event)" hidden>
          <h2>Reset Password</h2>
          <p class="form-help">Enter your registered email and we will send you a secure password reset link.</p>
          <input type="email" id="reset-identity" placeholder="Email Address" required>
          <button type="submit">RESET PASSWORD</button>
          <button type="button" class="back-button" onclick="showLogin()">BACK TO LOGIN</button>
          <p id="reset-message"></p>
        </form>

        <form id="signup-form" class="signup-form" onsubmit="createAccount(event)" hidden>
          <h2>Registration Form</h2>

          <div class="signup-grid">
            <label>Full Name
              <input type="text" id="full-name" required>
            </label>
            <label>Student ID
              <input type="text" id="student-id" required>
            </label>

            <label>Year &amp; Level
              <select id="year-level" required>
                <option value="" disabled selected>Please Select</option>
                <option>Grade 7</option>
                <option>Grade 8</option>
                <option>Grade 9</option>
                <option>Grade 10</option>
                <option>Grade 11</option>
                <option>Grade 12</option>
              </select>
            </label>
            <label>Gender
              <select id="gender" required>
                <option value="" disabled selected>Please Select</option>
                <option>Male</option>
                <option>Female</option>
                <option>Prefer not to say</option>
              </select>
            </label>

            <label class="full-field">Email Address
              <input type="email" id="email" required>
            </label>

            <label>Password
              <span class="password-field">
                <input type="password" id="signup-password" required>
                <button type="button" class="password-toggle" aria-label="Show password" onclick="togglePassword('signup-password', this)">◉</button>
              </span>
            </label>
            <label>Confirm Password
              <span class="password-field">
                <input type="password" id="confirm-password" required>
                <button type="button" class="password-toggle" aria-label="Show password" onclick="togglePassword('confirm-password', this)">◉</button>
              </span>
            </label>
          </div>

          <label class="agreement"><input type="checkbox" required> <em>I confirm that the information I provided is accurate.</em></label>

          <button type="submit">CREATE ACCOUNT</button>
          <button type="button" class="back-button" onclick="showLogin()">BACK TO LOGIN</button>
          <p id="signup-message"></p>
        </form>

      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  </script>
  <script src="script.js"></script>
</body>
</html>
